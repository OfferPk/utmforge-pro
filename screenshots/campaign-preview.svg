<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850">
  <defs>
    <style>
      .app-bg { fill: #040711; }
      .card-bg { fill: #0f172a; stroke: #243452; stroke-width: 1.5; rx: 12; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
      .header-sub { font-family: sans-serif; font-size: 13px; fill: #94a3b8; }
      .url-box { fill: #0b1120; stroke: #243452; stroke-width: 1; rx: 8; }
      .url-txt { font-family: monospace; font-size: 13px; fill: #38bdf8; word-break: break-all; }
      .tbl-hdr { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #94a3b8; }
      .tbl-row { fill: #182238; stroke: #243452; stroke-width: 1; rx: 6; }
      .key-txt { font-family: monospace; font-size: 12px; font-weight: 700; fill: #06b6d4; }
      .val-txt { font-family: monospace; font-size: 12px; fill: #f8fafc; }
      .badge-valid { fill: rgba(16, 185, 129, 0.12); stroke: #059669; stroke-width: 1; rx: 6; }
      .badge-txt { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #10b981; }
    </style>
  </defs>

  <rect class="app-bg" width="1000" height="850" />

  <!-- Main Card -->
  <rect class="card-bg" x="80" y="50" width="840" height="750" />

  <!-- Header -->
  <g transform="translate(120, 95)">
    <text class="header-title" x="0" y="20">Production Campaign Tracking Link</text>
    <text class="header-sub" x="0" y="42">Google Analytics 4 &amp; Multi-Touch Attribution Verified</text>
    <line x1="0" y1="60" x2="760" y2="60" stroke="#243452" stroke-width="1" />
  </g>

  <!-- Validation Badge -->
  <g transform="translate(120, 175)">
    <rect class="badge-valid" width="760" height="36" />
    <circle cx="22" cy="18" r="6" fill="#10b981" />
    <text class="badge-txt" x="38" y="22">✓ GA4 STANDARDS COMPLIANT: All required parameters present and normalized.</text>
  </g>

  <!-- Formatted URL Box -->
  <g transform="translate(120, 230)">
    <rect class="url-box" width="760" height="75" />
    <text class="url-txt" x="20" y="32">https://cloudscale.ai/enterprise?utm_source=google&amp;utm_medium=cpc</text>
    <text class="url-txt" x="20" y="54">&amp;utm_campaign=q4-enterprise-ai-launch&amp;utm_term=cloud-inference&amp;discount=enter20</text>
  </g>

  <!-- Parameter Breakdown Table -->
  <g transform="translate(120, 335)">
    <text font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc" x="0" y="0">Attribution Parameter Breakdown</text>

    <!-- Row 1: utm_source -->
    <g transform="translate(0, 18)">
      <rect class="tbl-row" width="760" height="38" />
      <text class="key-txt" x="20" y="24">utm_source</text>
      <text class="val-txt" x="240" y="24">google</text>
      <text font-family="sans-serif" font-size="10.5" fill="#94a3b8" x="600" y="24">Search Engine Traffic</text>
    </g>

    <!-- Row 2: utm_medium -->
    <g transform="translate(0, 62)">
      <rect class="tbl-row" width="760" height="38" />
      <text class="key-txt" x="20" y="24">utm_medium</text>
      <text class="val-txt" x="240" y="24">cpc</text>
      <text font-family="sans-serif" font-size="10.5" fill="#94a3b8" x="600" y="24">Paid Search Advertising</text>
    </g>

    <!-- Row 3: utm_campaign -->
    <g transform="translate(0, 106)">
      <rect class="tbl-row" width="760" height="38" />
      <text class="key-txt" x="20" y="24">utm_campaign</text>
      <text class="val-txt" x="240" y="24">q4-enterprise-ai-launch</text>
      <text font-family="sans-serif" font-size="10.5" fill="#94a3b8" x="600" y="24">Strategic Campaign</text>
    </g>

    <!-- Row 4: utm_term -->
    <g transform="translate(0, 150)">
      <rect class="tbl-row" width="760" height="38" />
      <text class="key-txt" x="20" y="24">utm_term</text>
      <text class="val-txt" x="240" y="24">cloud-inference-cluster</text>
      <text font-family="sans-serif" font-size="10.5" fill="#94a3b8" x="600" y="24">Paid Keyword Target</text>
    </g>

    <!-- Row 5: custom discount -->
    <g transform="translate(0, 194)">
      <rect class="tbl-row" width="760" height="38" />
      <text class="key-txt" x="20" y="24">discount</text>
      <text class="val-txt" x="240" y="24">enterprise20</text>
      <text font-family="sans-serif" font-size="10.5" fill="#94a3b8" x="600" y="24">20% Promotional Coupon</text>
    </g>
  </g>

  <!-- Vector QR Code Preview Box -->
  <g transform="translate(120, 595)">
    <rect fill="#182238" stroke="#243452" stroke-width="1" width="760" height="170" rx="8" />
    
    <!-- Mini QR representation -->
    <g transform="translate(25, 18)">
      <rect fill="#ffffff" width="135" height="135" rx="6" />
      <!-- Finder corners -->
      <rect fill="#0a0f1d" x="12" y="12" width="30" height="30" rx="2" />
      <rect fill="#ffffff" x="18" y="18" width="18" height="18" />
      <rect fill="#0a0f1d" x="22" y="22" width="10" height="10" />

      <rect fill="#0a0f1d" x="93" y="12" width="30" height="30" rx="2" />
      <rect fill="#ffffff" x="99" y="18" width="18" height="18" />
      <rect fill="#0a0f1d" x="103" y="22" width="10" height="10" />

      <rect fill="#0a0f1d" x="12" y="93" width="30" height="30" rx="2" />
      <rect fill="#ffffff" x="18" y="99" width="18" height="18" />
      <rect fill="#0a0f1d" x="22" y="103" width="10" height="10" />

      <!-- Center Badge -->
      <rect fill="#ffffff" stroke="#0a0f1d" stroke-width="1.5" x="38" y="58" width="60" height="18" rx="3" />
      <text font-family="sans-serif" font-size="8" font-weight="900" fill="#0a0f1d" x="68" y="70" text-anchor="middle">SCAN ME</text>
    </g>

    <g transform="translate(185, 35)">
      <text font-family="sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Vector Print QR Code with Embedded Deep-Link</text>
      <text font-family="sans-serif" font-size="11.5" fill="#94a3b8" y="25">Fully compatible with ISO/IEC 18004 standards and high-resolution commercial print presses.</text>
      <text font-family="sans-serif" font-size="11" fill="#06b6d4" font-weight="700" y="50">Ready for Trade Show Standees, Product Packaging &amp; Billboards</text>
    </g>
  </g>
</svg>
